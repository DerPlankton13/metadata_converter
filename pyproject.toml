[project]
name = "metadata-converter"
version = "0.1.0"
description = "This converter will help you create linked metadata as json-ld files from a flat input."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "boltons>=26.0.0",
    "ipython>=9.11.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "requests>=2.32.5",
    "tqdm>=4.67.0",
]

[dependency-groups]
dev = [
    "deepdiff>=9.0.0",
    "ipykernel>=7.2.0",
    "py-spy>=0.4.2",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
]

[project.scripts]
converter = "metadata_converter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the project root on sys.path so `from tests.…` imports resolve under a bare
# `pytest` invocation (plain `pytest` does not add the CWD the way `python -m pytest` does).
pythonpath = ["."]


[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
# SchemaOrgBase in the generator references PropertyValue — a name that exists only
# in the generated output module, where it resolves as a forward reference.
"src/metadata_converter/schema_org_models/schema_org_model_generator.py" = ["F821"]
